body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:0;background:var(--bg);color:var(--ink);font-family:"Klee One","Stroke","Yu Gothic",sans-serif;line-height:1.6;touch-action:manipulation;}

.card{touch-action:none;background:var(--card);border:2px solid var(--grid);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{font:inherit;font-weight:700;border:2px solid var(--acc);background:var(--card);color:var(--acc);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;width:100%}
.btn.main{background:var(--acc);color:var(--accink)}
.btn small{display:block;font-weight:500;opacity:.8}
.row{display:flex;gap:10px}.row .btn{flex:1}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
.word{font-size:10.6rem;font-family:"Stroke";text-align:center;margin:8px 0 4px;line-height:1.2}
.readon{text-align:center;font-size:1.3rem;font-weight:700;margin:0}
.readkun{text-align:center;font-size:1.3rem;font-weight:700;margin:0}
.box{touch-action:none;position:relative;width:min(80vw,300px);aspect-ratio:1;margin:14px auto;border:2px solid var(--grid);background:
linear-gradient(90deg,transparent calc(50% - 1px),var(--grid) calc(50% - 1px),var(--grid) calc(50% + 1px),transparent calc(50% + 1px)),
linear-gradient(0deg,transparent calc(50% - 1px),var(--grid) calc(50% - 1px),var(--grid) calc(50% + 1px),transparent calc(50% + 1px));background-color:var(--card)}
.box canvas{touch-action:none;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.ghost{transform: translateY(-5%);user-select:none;-webkit-user-select:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(64vw,240px);line-height:1;opacity:0;pointer-events:none;transition:opacity .2s}
.ghost.on{opacity:.14;}
.ans{font-size:min(30vw,120px);text-align:center;line-height:1.1;color:var(--ok);margin:4px 0}
.chk{display:flex;align-items:center;gap:8px;justify-content:center;margin:4px 0 12px;font-weight:700}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
</style>
</head>

<script>

   const BASE = "https://api.kyoiku-kanji.st-man.com/v1";

async function api(path, params = {}) {
  const url = new URL(BASE + path);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);

  const res = await fetch(url);
  if (res.status === 429) throw new Error("リクエストが多すぎます(60回/分まで)");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

const listKanji   = (params) => api("/kanji", params);                      // 一覧・検索・絞り込み
const randomKanji = ()       => api("/kanji/random");                       // ランダムな1字
const getKanji    = (ch)     => api(`/kanji/${encodeURIComponent(ch)}`);    // 単字の詳細
const getGrades   = ()       => api("/grades");                             // 学年ごとの字数

</script>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let count = 0;
try { count = Number(localStorage.getItem("RwiteCount")) || 0;}catch(_){}

const cntEl = document.getElementById("cnt");
const showCount = () => {cntEl.textContent = count;};

async function getrandomKanji() {
  const w = await randomKanji();
  console.log(w.kunyomi.ja.length > 0 );
  document.getElementById("word").textContent = w.kanji;
  document.getElementById("gh").textContent = w.kanji;
  document.getElementById("readon").textContent = w.kunyomi.ja;
  document.getElementById("readkun").textContent = w.onyomi.ja;
};
getrandomKanji();

function setup() {


  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr;          // 高解像度画面でもくっきり描く
  cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#222';

}
setup();

//次の問題に行くためのボタン
document.getElementById("next").onclick = () => {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.restore();
  getrandomKanji();
  count++;
  try {localStorage.setItem("RwiteCount", count);}catch(_){}
  showCount();
  idx = (idx + 1) % QUESTIONS.length;
}
showCount();

//クリアボタン
document.getElementById('clr').onclick = () => {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.restore();
};

// 書く処理
let activeId = null;
const pos = (e) => {
  const r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
};

cv.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  activeId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = pos(e);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + 0.1, y + 0.1);
  ctx.stroke();
  e.preventDefault();
});

cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activeId) return;     // ペンの浮かせ移動(hover)もここで無視される
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (events.length ? events : [e])) {
    const [x, y] = pos(ev);
    ctx.lineTo(x, y);
  }
  ctx.stroke();
});

// lostpointercapture は使わない(遅れて届き、次の画を打ち切るため)
['pointerup', 'pointercancel'].forEach((t) =>
  cv.addEventListener(t, (e) => { if (e.pointerId === activeId) activeId = null; })
);

cv.addEventListener('contextmenu', (e) => e.preventDefault());

document.getElementById('tr').onchange = (e) =>
  document.getElementById('gh').classList.toggle('on', e.target.checked);

//ダブルタップでのズームを無効
let lastTap = 0;
cv.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < 350) e.preventDefault();   // 350ms以内の2回目を無効にする
  lastTap = now;
}, { passive: false });

cv.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
cv.addEventListener('dblclick', (e) => e.preventDefault());

//リセットボタン
document.getElementById('reset').onclick = () => {
  count = 0;
  showCount();
};
</script>
